name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 自测与导出（Windows / Linux）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Godot 与导出模板
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: 导入资源
        run: godot --headless --path . --import

      - name: 无头自测（源码）
        run: |
          set -o pipefail
          godot --headless --path . -- --selftest | tee "$RUNNER_TEMP/selftest.log"
          grep -Eq "RESULT: [0-9]+ checks, 0 failed" "$RUNNER_TEMP/selftest.log"

      - name: 导出 Windows 可执行文件
        run: |
          mkdir -p build/windows build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/EscapeGravity.exe

      - name: 导出 Linux 可执行文件
        run: godot --headless --path . --export-release "Linux (verification)" build/linux/EscapeGravity.x86_64

      - name: 验证导出产物
        run: |
          set -euo pipefail
          file build/windows/EscapeGravity.exe | tee "$RUNNER_TEMP/windows.txt"
          grep -q "PE32+ executable" "$RUNNER_TEMP/windows.txt"
          grep -q "x86-64" "$RUNNER_TEMP/windows.txt"
          tail -c 4 build/windows/EscapeGravity.exe | grep -q GDPC
          chmod +x build/linux/EscapeGravity.x86_64
          ./build/linux/EscapeGravity.x86_64 --headless -- --selftest | tee "$RUNNER_TEMP/selftest-export.log"
          grep -Eq "RESULT: [0-9]+ checks, 0 failed" "$RUNNER_TEMP/selftest-export.log"

      - name: 打包 dist
        run: python3 tools/make_dist.py --platforms windows,linux

      - name: 显示校验和
        run: cat dist/SHA256SUMS.txt

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: escape-gravity-dist
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Windows 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: EscapeGravity-windows-x86_64
          path: build/windows/EscapeGravity.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Linux 可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: EscapeGravity-linux-x86_64
          path: build/linux/EscapeGravity.x86_64
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 下载发布包工件
        uses: actions/download-artifact@v4
        with:
          name: escape-gravity-dist
          path: dist

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Escape Gravity $GITHUB_REF_NAME" \
            --generate-notes
